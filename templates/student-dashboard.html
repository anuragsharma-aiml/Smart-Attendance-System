 <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Dashboard | Smart Attendance</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <main class="dashboard-page">

        <section class="dashboard-card">
        
<!-- Recent Attendance -->
            <!-- Logo -->
            <div class="dashboard-logo">
                🎓
            </div>


            <!-- Title -->
            <div class="dashboard-title">

                <h1>Student Dashboard</h1>

                <p>
                    Welcome to Smart Attendance System
                </p>

            </div>


            <!-- Student Information -->
            <div class="student-info-card">

                <div class="student-info-row">

                    <span class="info-label">
                        Student ID
                    </span>

                    <strong id="dashboardStudentId">
                        STU001
                    </strong>

                </div>


                <div class="student-info-row">

                    <span class="info-label">
                        Class
                    </span>

                    <strong id="dashboardStudentClass">
                        B.Tech CSE AI&ML - 2nd Year
                    </strong>

                </div>

            </div>


            <!-- Dashboard Options -->
            <div class="dashboard-options">

                <button
                    class="dashboard-button"
                    onclick="window.location.href='/scan-qr'">

                    <span class="button-icon">
                        📷
                    </span>

                    <span class="button-content">

                        <strong>
                            Scan QR Code
                        </strong>

                        <small>
                            Scan the teacher's QR to mark attendance
                        </small>

                    </span>

                    <span class="button-arrow">
                        ›
                    </span>

                </button>


                <button
                    class="dashboard-button"
                    onclick="window.location.href='/my-attendance'">

                    <span class="button-icon">
                        📊
                    </span>

                    <span class="button-content">

                        <strong>
                            My Attendance
                        </strong>

                        <small>
                            View your attendance records
                        </small>

                    </span>

                    <span class="button-arrow">
                        ›
                    </span>

                </button>

            </div>


            <!-- Logout -->
            <button
                class="logout-button"
                onclick="window.location.href='/logout'">

                🚪 Logout

            </button>


            <div class="dashboard-footer">
                Smart Attendance Management System
            </div>

        </section>

    </main>


    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
