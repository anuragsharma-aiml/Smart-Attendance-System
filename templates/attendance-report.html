<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Attendance Report</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 12px;
            text-align: center;
        }

        th {
            background: #f2f2f2;
        }

        button {
            padding: 10px 20px;
            margin-top: 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>📄 Attendance Report</h1>

    <table>

        <thead>
            <tr>
                <th>Student ID</th>
                <th>Present</th>
                <th>Total</th>
                <th>Attendance %</th>
            </tr>
        </thead>

        <tbody>

            {% for report in reports %}

            <tr>
                <td>{{ report[0] }}</td>
                <td>{{ report[1] }}</td>
                <td>{{ report[2] }}</td>
                <td>{{ report[3] }}%</td>
            </tr>

            {% endfor %}

        </tbody>

    </table>

    <button onclick="window.location.href='/teacher-dashboard'">
        Back to Teacher Dashboard
    </button>

</body>

</html>
