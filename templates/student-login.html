 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login | Smart Attendance</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <main class="login-page">
        <section class="login-box">

            <div class="login-logo">🎓</div>

            <div class="login-heading">
                <h1>Student Login</h1>
                <p>Smart Attendance Management System</p>
            </div>

            <form id="studentLoginForm">
                <div class="form-group">
                    <label for="studentId">Student ID</label>
                    <input
                        type="text"
                        id="studentId"
                        name="student_id"
                        placeholder="Enter your Student ID"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="studentPassword">Password</label>
                    <input
                        type="password"
                        id="studentPassword"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit" id="loginButton">
                    <span id="loginText">Login</span>
                </button>

                <p id="loginMessage"
                   class="login-message"
                   role="status"
                   aria-live="polite"></p>
            </form>

            <div class="login-footer">
                <span>Smart Attendance</span>
                <span>•</span>
                <span>Student Portal</span>
            </div>

        </section>
    </main>

    <script>
        const loginForm = document.getElementById("studentLoginForm");
        const loginButton = document.getElementById("loginButton");
        const loginText = document.getElementById("loginText");
        const loginMessage = document.getElementById("loginMessage");

        loginForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            const studentId =
                document.getElementById("studentId").value.trim();

            const password =
                document.getElementById("studentPassword").value;

            loginMessage.textContent = "";
            loginMessage.className = "login-message";

            if (!studentId || !password) {
                loginMessage.textContent =
                    "Please enter Student ID and Password.";
                loginMessage.classList.add("error");
                return;
            }

            loginButton.disabled = true;
            loginText.textContent = "Logging in...";

            try {
                const response = await fetch("/student-login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },
                    body: JSON.stringify({
                        student_id: studentId,
                        password: password
                    })
                });

                const result = await response.json();

                if (!response.ok || result.success !== true) {
                    loginMessage.textContent =
                        result.message || "Invalid login details.";
                    loginMessage.classList.add("error");
                    return;
                }

                // Save only non-sensitive student information.
                localStorage.setItem("studentId", result.student_id || "");
                localStorage.setItem("studentName", result.name || "");
                localStorage.setItem("studentClass", result.class_name || "");

                loginText.textContent = "Login successful";
                loginMessage.textContent =
                    "Welcome, " + (result.name || "Student") + "!";
                loginMessage.classList.add("success");

                window.location.assign("/student-dashboard");

            } catch (error) {
                console.error("Student login request failed:", error);

                loginMessage.textContent =
                    "Unable to connect to the server. Please try again.";
                loginMessage.classList.add("error");

            } finally {
                loginButton.disabled = false;

                if (loginText.textContent === "Logging in...") {
                    loginText.textContent = "Login";
                }
            }
        });
    </script>
</body>
</html>
