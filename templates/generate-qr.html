 
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Generate QR | Smart Attendance</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>
        .qr-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: left;
        }

        .qr-form label {
            display: block;
            font-size: 16px;
            font-weight: 700;
            color: #1e293b;
            margin-top: 8px;
            margin-bottom: 0;
        }

        .qr-form input,
        .qr-form select {
            display: block;
            width: 100%;
            box-sizing: border-box;
            min-height: 52px;
            padding: 14px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            background: #ffffff;
            color: #1e293b;
            font-size: 16px;
            font-weight: 500;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .qr-form input:focus,
        .qr-form select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .qr-form select {
            cursor: pointer;
        }

        .qr-form .generate-button {
            width: 100%;
            margin-top: 12px;
            cursor: pointer;
        }

        .qr-container {
            margin-top: 24px;
        }

        #qrcode {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 16px auto;
        }

        #qrcode img,
        #qrcode canvas {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>

<body>

    <main class="dashboard-page">

        <section class="qr-card">

            <!-- Header -->
            <div class="dashboard-logo">
                📱
            </div>

            <div class="dashboard-title">
                <h1>Generate QR Code</h1>
                <p>Create a QR code for student attendance</p>
            </div>

            <!-- QR Form -->
            <div class="qr-form">

                <label for="studentId">Student ID</label>

                <input
                    type="text"
                    id="studentId"
                    placeholder="Enter Student ID"
                    value="STU001"
                    autocomplete="off"
                    required
                >

                <label for="subject">Subject</label>

                <select id="subject" required>
                    <option value="">Select Subject</option>
                    <option value="DSTL">DSTL</option>
                    <option value="Digital Electronics">Digital Electronics</option>
                    <option value="Data Structures">Data Structures</option>
                    <option value="Computer Organization">Computer Organization</option>
                    <option value="Python Programming">Python Programming</option>
                    <option value="UHPVE">UHPVE</option>
                </select>

                <button
                    type="button"
                    class="generate-button"
                    onclick="generateQR()">
                    📱 Generate QR Code
                </button>

            </div>

            <!-- QR Area -->
            <div id="qrContainer" class="qr-container">

                <div id="qrcode"></div>

                <p id="qrNote">
                    Enter a Student ID and generate the QR code.
                </p>

            </div>

            <!-- Back -->
            <button
                type="button"
                class="back-dashboard-button"
                onclick="window.location.href='/teacher-dashboard'">
                ← Back to Dashboard
            </button>

        </section>

    </main>

    <script>
        function generateQR() {
            const studentId = document.getElementById("studentId").value.trim();
            const subject = document.getElementById("subject").value.trim();

            const qrCode = document.getElementById("qrcode");
            const qrNote = document.getElementById("qrNote");

            if (studentId === "") {
                alert("Please enter Student ID.");
                return;
            }

            if (subject === "") {
                alert("Please select a subject.");
                return;
            }

            if (typeof QRCode === "undefined") {
                alert("QR library could not load. Please check your internet connection and refresh the page.");
                return;
            }

            qrCode.innerHTML = "";

            const qrData = JSON.stringify({
                student_id: studentId,
                subject: subject
            });

            new QRCode(qrCode, {
                text: qrData,
                width: 256,
                height: 256
            });

            qrNote.textContent =
                "QR generated for Student ID: " + studentId +
                " | Subject: " + subject;
        }
    </script>

</body>
</html>
