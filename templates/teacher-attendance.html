<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Teacher Attendance</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 12px;
            text-align: center;
        }

        th {
            background: #f2f2f2;
        }

        button {
            padding: 10px 20px;
            margin-top: 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>📋 Attendance Records</h1>

    <table>

        <thead>
            <tr>
                <th>Student ID</th>
                <th>Subject</th>
                <th>Date</th>
                <th>Time</th>
                <th>Status</th>
            </tr>
        </thead>

        <tbody>

            {% if records %}

                {% for record in records %}

                <tr>
                    <td>{{ record[0] }}</td>
                    <td>{{ record[1] }}</td>
                    <td>{{ record[2] }}</td>
                    <td>{{ record[3] }}</td>
                    <td>{{ record[4] }}</td>
                </tr>

                {% endfor %}

            {% else %}

                <tr>
                    <td colspan="5">
                        No attendance records found.
                    </td>
                </tr>

            {% endif %}

        </tbody>

    </table>

    <button onclick="window.location.href='/teacher-dashboard'">
        Back to Teacher Dashboard
    </button>

</body>

</html>
