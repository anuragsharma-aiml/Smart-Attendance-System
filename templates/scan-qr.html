<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Scan QR | Smart Attendance</title>

    <script src="https://unpkg.com/html5-qrcode"></script>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <main class="dashboard-page">
        <section class="scan-card">

            <div class="dashboard-logo">📷</div>

            <div class="dashboard-title">
                <h1>Scan QR Code</h1>
                <p>Scan the QR code to mark your attendance</p>
            </div>

            <div class="scanner-container">
                <div id="reader"></div>

                <p class="scanner-hint">
                    📱 Allow camera access and place the QR code
                    inside the scanning area.
                </p>
            </div>

            <div id="result" class="scan-result">
                Waiting for QR scan...
            </div>

            <button
                class="back-dashboard-button"
                onclick="window.location.href='/student-dashboard'">
                ← Back to Dashboard
            </button>

        </section>
    </main>

    <script>
        let scanProcessing = false;

        function onScanSuccess(decodedText, decodedResult) {
            if (scanProcessing) return;

            const result = document.getElementById("result");
            let qrData;

            try {
                qrData = JSON.parse(decodedText);
            } catch (error) {
                result.className = "scan-result error";
                result.innerText =
                    "❌ Invalid QR format. Please use the teacher-generated QR.";
                return;
            }

            if (!qrData.student_id || !qrData.subject) {
                result.className = "scan-result error";
                result.innerText =
                    "❌ Student ID or Subject is missing from the QR.";
                return;
            }

            scanProcessing = true;
            result.className = "scan-result scanning";
            result.innerText = "QR detected. Marking attendance...";

            html5QrcodeScanner.clear()
                .catch(error => console.log("Scanner stop:", error));

            fetch("/mark-attendance", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    student_id: qrData.student_id,
                    subject: qrData.subject
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    result.className = "scan-result success";
                    result.innerText = "✅ " + data.message;
                } else {
                    result.className = "scan-result error";
                    result.innerText = "❌ " + data.message;
                }
            })
            .catch(error => {
                console.error("Attendance error:", error);
                result.className = "scan-result error";
                result.innerText =
                    "❌ Server error. Please try again.";
            });
        }

        function onScanFailure(error) {
            // QR not detected yet.
        }

        const html5QrcodeScanner = new Html5QrcodeScanner(
            "reader",
            {
                fps: 10,
                qrbox: {
                    width: 250,
                    height: 250
                },
                rememberLastUsedCamera: true
            },
            false
        );

        html5QrcodeScanner.render(
            onScanSuccess,
            onScanFailure
        );
    </script>

</body>
</html>
