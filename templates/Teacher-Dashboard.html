 <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Teacher Dashboard | Smart Attendance</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <main class="dashboard-page">

        <section class="dashboard-card">

            <!-- Logo -->
            <div class="dashboard-logo">
                📊
            </div>

            <!-- Title -->
            <div class="dashboard-title">
                <h1>Teacher Dashboard</h1>

                <p>
                    Manage attendance and student records
                </p>
            </div>


            <!-- Dashboard Options -->
            <div class="dashboard-options">

                <button
                    class="dashboard-button"
                    onclick="window.location.href='/generate-qr'">

                    <span class="button-icon">📱</span>

                    <span class="button-content">
                        <strong>Generate QR Code</strong>
                        <small>Create attendance QR for students</small>
                    </span>

                    <span class="button-arrow">›</span>

                </button>


                <button
                    class="dashboard-button"
                    onclick="window.location.href='/teacher-attendance'">

                    <span class="button-icon">📋</span>

                    <span class="button-content">
                        <strong>View Attendance</strong>
                        <small>View student attendance records</small>
                    </span>

                    <span class="button-arrow">›</span>

                </button>


                <button
                    class="dashboard-button"
                    onclick="window.location.href='/attendance-report'">

                    <span class="button-icon">📄</span>

                    <span class="button-content">
                        <strong>Attendance Report</strong>
                        <small>Check attendance summary and reports</small>
                    </span>

                    <span class="button-arrow">›</span>

                </button>

            </div>


            <!-- Logout -->
            <button
                class="logout-button"
                onclick="window.location.href='/teacher-logout'">

                Logout

            </button>


            <div class="dashboard-footer">
                Smart Attendance Management System
            </div>

        </section>

    </main>

</body>

</html>
